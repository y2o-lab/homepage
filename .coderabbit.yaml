# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 設定項目: https://docs.coderabbit.ai/reference/configuration
language: ja-JP
tone_instructions: >-
  レビュー、要約、会話は日本語で、平易な言葉を使って簡潔に書いてください。
  指摘は「問題・起こる影響・具体的な修正案」の順に、原則3文以内で説明してください。
  専門用語には必要な場合だけ短い説明を添え、コード識別子は原文を保ってください。
  根拠のない断定、重複した指摘、長い前置き、好みだけの変更提案は避けてください。
early_access: false

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    変更の目的と主な動作の変化を、日本語で最大3項目の短い箇条書きにしてください。
    実施が確認できないテストや効果を、実施済み・達成済みとして書かないでください。
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    # デフォルトブランチに加え、本番サイトとインフラの昇格PRもレビューする。
    base_branches:
      - '^release$'
      - '^release-infra$'

  # コンテンツ、CI、Terraform、Codex設定はレビュー対象に残す。
  # node_modules、dist、lockfileなどはCodeRabbit標準の除外に任せる。
  path_filters:
    - '!**/.astro/**'
    - '!**/coverage/**'
    - '!**/playwright-report/**'
    - '!**/test-results/**'
    - '!artifacts/**'
    - '!docs/evidence/**/*.png'

  path_instructions:
    - path: 'src/**'
      instructions: >-
        Astroの静的生成とSvelte islandsの境界、生成されるURL、アクセシビリティ、
        モバイル表示を確認してください。Markdown/MDXや写真の変更では、
        公開・下書きの扱い、ホームのLatest、件数、日付、リンクとの整合性を確認してください。
    - path: '.github/workflows/**'
      instructions: >-
        実行イベントとブランチ条件、最小権限、Secretsの公開範囲、ActionのSHA固定を確認してください。
        pnpmとNode.jsの設定が既存CIと整合し、外部PRから本番権限を使えないことを確認してください。
    - path: 'infra/**'
      instructions: >-
        Cloudflare Pages、ドメイン、Terraform stateへの影響を確認してください。
        Terraform Coreとproviderのバージョンを区別し、mise.toml、制約、lockfile、
        plan/applyのツール設定との整合性を確認してください。

  pre_merge_checks:
    docstrings:
      mode: 'off'

  tools:
    biome:
      enabled: true
    eslint:
      enabled: false
    oxc:
      enabled: false

knowledge_base:
  code_guidelines:
    # AGENTS.mdは自動検出されるため、存在しないADRや他リポジトリの設計書を指定しない。
    enabled: true
