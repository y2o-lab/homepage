name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production website
    if: github.event_name == 'push' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: https://yuno-i.com

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.5

      - name: Install project tools
        run: mise install

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload production deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.0'
          command: pages deploy dist --project-name=homepage --branch=release
