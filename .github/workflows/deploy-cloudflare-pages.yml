name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production website
    if: github.event_name == 'push' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: https://yuno-i.com

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.5

      - name: Install project tools
        run: mise install

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload production deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.0'
          command: pages deploy dist --project-name=homepage --branch=release

      - name: Remove inactive Cloudflare Pages deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: homepage
        run: |
          active_deployment_id=''
          while true; do
            if ! deployment_json="$(pnpm exec wrangler pages deployment list --project-name "$PROJECT_NAME" --json)"; then
              echo 'Failed to list Cloudflare Pages deployments.' >&2
              exit 1
            fi

            if ! deployment_ids="$(printf '%s\n' "$deployment_json" | jq -r '.[] | (.Id // .id) | select(type == "string" and length > 0)')"; then
              echo 'Failed to read Cloudflare Pages deployment IDs.' >&2
              exit 1
            fi

            deployment_ids="$(printf '%s\n' "$deployment_ids" | grep -v -F -x "$active_deployment_id" || true)"

            if [ -z "$deployment_ids" ]; then
              echo "Only the active production deployment remains."
              break
            fi

            while IFS= read -r deployment_id; do
              [ -z "$deployment_id" ] && continue

              delete_output="$(pnpm exec wrangler pages deployment delete "$deployment_id" --project-name "$PROJECT_NAME" --force 2>&1)"
              printf '%s\n' "$delete_output"

              if printf '%s\n' "$delete_output" | grep -q 'Successfully deleted'; then
                continue
              fi

              if printf '%s\n' "$delete_output" | grep -q 'active production deployment'; then
                active_deployment_id="$deployment_id"
                continue
              fi

              exit 1
            done <<EOF
          $deployment_ids
          EOF
          done
