name: Manage Cloudflare Pages infrastructure

on:
  pull_request:
    branches:
      - release-infra
  push:
    branches:
      - release-infra

permissions:
  contents: read

jobs:
  plan:
    name: Plan production infrastructure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-pages-terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.7

      - name: Install project tools
        run: mise install

      - name: Format-check Terraform
        run: mise exec terraform -- terraform fmt -check -recursive infra

      - name: Initialize Terraform backend
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform init -input=false

      - name: Validate Terraform
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform validate

      - name: Plan Terraform changes
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform plan -input=false -no-color

  apply:
    name: Apply production infrastructure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-pages-terraform-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.7

      - name: Install project tools
        run: mise install

      - name: Format-check Terraform
        run: mise exec terraform -- terraform fmt -check -recursive infra

      - name: Initialize Terraform backend
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform init -input=false

      - name: Validate Terraform
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform validate

      - name: Apply Terraform changes
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform apply -auto-approve -input=false
