name: Manage Cloudflare Pages infrastructure

on:
  pull_request:
    branches:
      - release-infra
  push:
    branches:
      - release-infra

permissions:
  contents: read

jobs:
  plan:
    name: Plan production infrastructure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-pages-terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
      TF_BACKEND_ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
      TF_VAR_custom_domain: ${{ secrets.TF_VAR_custom_domain }}
      TF_VAR_dns_record_name: ${{ secrets.TF_VAR_dns_record_name }}
      TF_VAR_project_name: ${{ secrets.TF_VAR_project_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.5

      - name: Install project tools
        run: mise install

      - name: Format-check Terraform
        run: mise exec terraform -- terraform fmt -check -recursive infra

      - name: Initialize Terraform backend
        working-directory: infra/cloudflare/environments/production
        run: >-
          mise exec terraform -- terraform init -input=false
          -backend-config="bucket=$TF_BACKEND_BUCKET"
          -backend-config="key=cloudflare/production/terraform.tfstate"
          -backend-config="region=auto"
          -backend-config="endpoints={s3=\"$TF_BACKEND_ENDPOINT\"}"

      - name: Validate Terraform
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform validate

      - name: Plan Terraform changes
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform plan -input=false -no-color

  apply:
    name: Apply production infrastructure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-pages-terraform-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
      TF_BACKEND_ENDPOINT: ${{ secrets.TF_BACKEND_ENDPOINT }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
      TF_VAR_custom_domain: ${{ secrets.TF_VAR_custom_domain }}
      TF_VAR_dns_record_name: ${{ secrets.TF_VAR_dns_record_name }}
      TF_VAR_project_name: ${{ secrets.TF_VAR_project_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.5

      - name: Install project tools
        run: mise install

      - name: Format-check Terraform
        run: mise exec terraform -- terraform fmt -check -recursive infra

      - name: Initialize Terraform backend
        working-directory: infra/cloudflare/environments/production
        run: >-
          mise exec terraform -- terraform init -input=false
          -backend-config="bucket=$TF_BACKEND_BUCKET"
          -backend-config="key=cloudflare/production/terraform.tfstate"
          -backend-config="region=auto"
          -backend-config="endpoints={s3=\"$TF_BACKEND_ENDPOINT\"}"

      - name: Validate Terraform
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform validate

      - name: Apply Terraform changes
        working-directory: infra/cloudflare/environments/production
        run: mise exec terraform -- terraform apply -auto-approve -input=false
